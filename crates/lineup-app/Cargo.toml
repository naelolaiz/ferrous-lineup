[package]
name = "lineup-app"
description = "Play songs with a backing band and learn harmony"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferrous-lineup"
path = "src/main.rs"

[features]
default = []
separation = ["separation-charon", "separation-stem-splitter", "separation-demucs"]
separation-charon = ["lineup-listen/separation-charon"]
separation-stem-splitter = ["lineup-listen/separation-stem-splitter"]
separation-demucs = ["lineup-listen/separation-demucs"]

[dependencies]
lineup-core.workspace = true
lineup-audio.workspace = true
lineup-listen.workspace = true
lineup-video.workspace = true
eframe.workspace = true
egui_system_font_provider.workspace = true
rfd.workspace = true
midir.workspace = true
serde.workspace = true
ron.workspace = true
ureq.workspace = true
pdf-writer.workspace = true
ttf-parser.workspace = true

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# The files Finder asks the app to open (see src/open_files.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL"] }

# Debian and Ubuntu packages: `cargo deb -p lineup-app`.
# The desktop file, icon, MIME type and AppStream data are the same ones
# the AppImage and the Flatpak install.
[package.metadata.deb]
name = "ferrous-lineup"
maintainer = "naelolaiz <naelolaiz@users.noreply.github.com>"
copyright = "2026, Ferrous Lineup contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Ferrous Lineup plays songs with a backing band and teaches harmony along \
the way. Type a song's chords, pick a style, and the band plays it in any \
key and tempo; a playlist, a step sequencer, a piano roll and a mixer let \
you change every part by hand. It also names the chords you hear and works \
with pitch-class sets, twelve-tone rows and Kröpfl's micromodes."""
depends = "$auto, desktop-file-utils, hicolor-icon-theme, libasound2, libstdc++6, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, shared-mime-info, xdg-desktop-portal"
section = "sound"
priority = "optional"
assets = [
    ["target/release/ferrous-lineup", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.naelolaiz.FerrousLineup.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icon/ferrous-lineup.svg", "usr/share/icons/hicolor/scalable/apps/io.github.naelolaiz.FerrousLineup.svg", "644"],
    ["../../packaging/linux/application-x-ferrous-lineup.xml", "usr/share/mime/packages/", "644"],
    ["../../packaging/linux/io.github.naelolaiz.FerrousLineup.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../README.md", "usr/share/doc/ferrous-lineup/README.md", "644"],
]
