[package]
name = "lineup-listen"
description = "Listening to recordings for Ferrous Lineup: decoding audio and extracting melody, bass, drums and chords"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
separation = ["separation-charon", "separation-stem-splitter", "separation-demucs"]
separation-charon = ["dep:tempfile"]
separation-stem-splitter = ["dep:tempfile"]
separation-demucs = ["dep:tempfile"]

[dependencies]
lineup-core.workspace = true
symphonia.workspace = true
realfft.workspace = true
hound.workspace = true
tempfile = { version = "3", optional = true }
