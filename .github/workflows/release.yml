name: Release

# Builds Ferrous Lineup for Linux, Windows and macOS (Apple Silicon and
# Intel), packed with the README and the licence, ready to download.
#
# - Every pull request, every push to main and every manual run (Actions
#   > Release > Run workflow) keeps the packages as artifacts of the run:
#   one per system, plus a Linux AppImage and .deb, a Windows installer,
#   and a macOS .dmg.
# - Pushing a tag that starts with `v` (v0.2.0) also publishes them on a
#   GitHub Release for that tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Only reading the code is allowed by default. The job that publishes the
# release asks for more below.
permissions:
  contents: read

# A newer push to the same branch cancels the build that is still running
# for the older one. Tags are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub still offers: a program built against
          # an older C library (glibc) also runs on newer systems, not the
          # other way round. When GitHub retires 22.04, move to 24.04.
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            appimage: true
          # `crt-static` puts Microsoft's C runtime inside the .exe, so it
          # runs on a Windows without the Visual C++ Redistributable.
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            rustflags: -C target-feature=+crt-static
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          # GitHub's macOS machines are Apple Silicon. Apple's compilers
          # build Intel programs there too, so only the Rust target differs.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `--locked` builds exactly the library versions in Cargo.lock.
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Linux and Windows: a folder with the program, README and licence,
      # wrapped in a .tar.gz (Linux) or a .zip (Windows). macOS gets a
      # real .app inside a .dmg in the step below.
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        env:
          # Keeps archive tools from adding their own hidden files.
          COPYFILE_DISABLE: 1
          # For a pull request GitHub builds a merge commit of its own;
          # the label names the pull request's latest commit instead.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="${COMMIT::7}"
          fi
          name="ferrous-lineup-$label-${{ matrix.platform }}"
          binary=ferrous-lineup
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi

          echo "LABEL=$label" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$binary" README.md LICENSE "dist/$name/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "$name.zip" "$name"
            echo "PACKAGE=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "PACKAGE=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi

      # macOS: a real .app (icon, Info.plist, version) inside a .dmg with
      # an Applications link, so people drag it into place instead of
      # unpacking a bare Unix program.
      - name: Package for macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          COPYFILE_DISABLE: 1
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="${COMMIT::7}"
          fi
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          name="ferrous-lineup-$label-${{ matrix.platform }}"
          app="dist/Ferrous Lineup.app"

          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/ferrous-lineup" "$app/Contents/MacOS/"
          cp packaging/macos/Info.plist "$app/Contents/"
          cp packaging/macos/AppIcon.icns "$app/Contents/Resources/"
          cp README.md LICENSE "$app/Contents/Resources/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"

          # An ad-hoc signature needs no Apple account, and is enough for
          # Apple Silicon, which refuses a completely unsigned arm64
          # program. Notarizing would need a paid Apple Developer ID;
          # until then Gatekeeper asks the first time.
          codesign --force --sign - "$app"

          mkdir -p dist/dmg
          cp -R "$app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Ferrous Lineup" -srcfolder dist/dmg -ov -format UDZO "dist/$name.dmg"

          echo "LABEL=$label" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "PACKAGE=dist/$name.dmg" >> "$GITHUB_ENV"

      # `archive: false` uploads the package as it is, so the artifact
      # downloads as the .zip, .tar.gz or .dmg itself, not wrapped in
      # another zip.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.PACKAGE }}
          archive: false
          if-no-files-found: error

      # An AppImage is one file that runs on most Linux systems: the
      # program, its icon and its menu entry, with a small starter program
      # (the "runtime") in front. The tools are pinned to a version and
      # checked against their SHA-256, so a release never builds with a
      # tool that changed under it.
      - name: Build the AppImage
        if: matrix.appimage
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          # appimagetool is an AppImage too; this runs it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo apt-get install -y libxkbcommon-x11-0 patchelf
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o runtime "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum --check
          echo "$RUNTIME_SHA256  runtime" | sha256sum --check
          chmod +x appimagetool

          # The AppDir is the folder the AppImage is made from, laid out
          # like a system's /usr. AppRun is what the AppImage starts.
          # The desktop file, icon, MIME type and AppStream data are named
          # after the app id, as Flathub and the software centers expect.
          app_id=io.github.naelolaiz.FerrousLineup
          install -Dm755 target/${{ matrix.target }}/release/ferrous-lineup AppDir/usr/bin/ferrous-lineup
          install -Dm644 "packaging/linux/$app_id.desktop" "AppDir/usr/share/applications/$app_id.desktop"
          install -Dm644 packaging/icon/ferrous-lineup.svg "AppDir/usr/share/icons/hicolor/scalable/apps/$app_id.svg"
          install -Dm644 packaging/linux/application-x-ferrous-lineup.xml AppDir/usr/share/mime/packages/application-x-ferrous-lineup.xml
          install -Dm644 "packaging/linux/$app_id.metainfo.xml" "AppDir/usr/share/metainfo/$app_id.metainfo.xml"
          ln -s usr/bin/ferrous-lineup AppDir/AppRun
          ln -s "usr/share/applications/$app_id.desktop" "AppDir/$app_id.desktop"
          ln -s "usr/share/icons/hicolor/scalable/apps/$app_id.svg" "AppDir/$app_id.svg"

          # The window needs the keyboard library xkbcommon, which some
          # systems lack (libxkbcommon-x11 above all), so the AppImage
          # carries its own copies. The program opens it while it runs
          # (dlopen); RUNPATH tells it to look in usr/lib before the system,
          # and the library to find its own companions next to itself.
          libdir=/usr/lib/x86_64-linux-gnu
          for lib in libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-xkb.so.1; do
            install -Dm644 "$(readlink -f "$libdir/$lib")" "AppDir/usr/lib/$lib"
          done
          # $ORIGIN is for the loader, meaning "this file's folder", so the
          # shell must not expand it: hence the single quotes.
          # shellcheck disable=SC2016
          patchelf --set-rpath '$ORIGIN/../lib' AppDir/usr/bin/ferrous-lineup
          # shellcheck disable=SC2016
          patchelf --set-rpath '$ORIGIN' AppDir/usr/lib/libxkbcommon-x11.so.0

          appimage="dist/$NAME.AppImage"
          ARCH=x86_64 VERSION="$LABEL" ./appimagetool --runtime-file runtime AppDir "$appimage"
          echo "APPIMAGE=$appimage" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: matrix.appimage
        with:
          name: ${{ env.NAME }}-appimage
          path: ${{ env.APPIMAGE }}
          archive: false
          if-no-files-found: error

      # The desktop entry, the MIME type and the AppStream file are the
      # part the software centers and file managers read. A typo here is
      # silent on a desktop, so check the syntax in CI.
      - name: Check the Linux metadata
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get install -y desktop-file-utils libxml2-utils
          desktop-file-validate packaging/linux/io.github.naelolaiz.FerrousLineup.desktop
          xmllint --noout packaging/linux/application-x-ferrous-lineup.xml
          xmllint --noout packaging/linux/io.github.naelolaiz.FerrousLineup.metainfo.xml

      # Inno Setup is part of the windows-latest image. The installer adds
      # a Start-menu entry, an uninstaller and the .lineup association;
      # the .zip above stays for people who want no installation.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Git Bash rewrites arguments that start with "/" as Windows
          # paths, which would turn ISCC's /D... defines into script names.
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then
            iscc="/c/Program Files/Inno Setup 6/ISCC.exe"
          fi
          if [ ! -f "$iscc" ]; then
            choco install innosetup --no-progress -y
            iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          "$iscc" /DAppVersion="$version" /DBuildLabel="$LABEL" packaging/windows/ferrous-lineup.iss
          echo "SETUP=dist/ferrous-lineup-$LABEL-windows-x86_64-setup.exe" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ferrous-lineup-${{ env.LABEL }}-windows-x86_64-setup
          path: ${{ env.SETUP }}
          archive: false
          if-no-files-found: error

      # A .deb for Debian, Ubuntu and their derivatives, built from the
      # same release binary and the same desktop/icon/MIME/AppStream files.
      - name: Build the .deb
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get install -y dpkg-dev
          if ! command -v cargo-deb >/dev/null; then
            cargo install cargo-deb --version 3.8.0 --locked
          fi
          cargo deb -p lineup-app --no-build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux-x86_64'
        with:
          name: ferrous-lineup-${{ env.LABEL }}-linux-x86_64-deb
          path: target/${{ matrix.target }}/debian/*.deb
          archive: false
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Compare the tag with the version in Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::warning::The tag is $GITHUB_REF_NAME, but Cargo.toml says version $version."
          fi

      # Each artifact lands in a folder of its own name. `skip-decompress`
      # keeps the Windows .zip as it is instead of unpacking it. No
      # `pattern`: the .deb is named ferrous-lineup_0.2.0-1_amd64.deb
      # (an underscore), and a pattern with a dash would leave it out.
      - uses: actions/download-artifact@v8
        with:
          path: downloads
          skip-decompress: true

      - name: Collect the packages and their checksums
        run: |
          shopt -s nullglob
          mkdir release
          for folder in downloads/*/; do
            for file in "$folder"*; do
              mv "$file" "release/$(basename "$file")"
            done
          done
          cd release
          sha256sum -- * > SHA256SUMS.txt
          ls -l

      # A tag with a dash (v0.2.0-beta.1) makes a pre-release. Running the
      # workflow again for a tag replaces the files of its release.
      - name: Create the release and upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" release/* \
              --title "Ferrous Lineup $TAG" \
              --generate-notes \
              --verify-tag \
              "${flags[@]}"
          fi
