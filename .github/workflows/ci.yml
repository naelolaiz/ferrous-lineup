name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test (${{ matrix.name }})
    # The same steps run on three operating systems. `fail-fast: false`
    # lets the others finish when one fails, so you see every failure at once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: ferrous-lineup-linux
            binary: target/release/ferrous-lineup
          - name: macOS
            os: macos-latest
            artifact: ferrous-lineup-macos
            binary: target/release/ferrous-lineup
          - name: Windows
            os: windows-latest
            artifact: ferrous-lineup-windows
            binary: target/release/ferrous-lineup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # macOS and Windows come with their audio and window libraries.
      # Linux needs the development files for ALSA, xkbcommon and Wayland.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting is the same everywhere, so it is checked once.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
