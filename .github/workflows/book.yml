name: Book

# Builds the books in book/ (English) and book-es/ (Spanish), and the user
# manuals in manual/ and manual-es/, with mdBook, prints each to one PDF,
# and publishes them on GitHub Pages: the English book at the root, as
# always, the Spanish one under /es/, and each manual under manual/ next
# to its book. Every pull request that changes a book or a manual builds
# it too, whichever branch it goes into (a book page stacked on the pull
# request of the change it describes included), so a change can be
# checked before it is merged; only a push to main, or a run by hand,
# publishes.
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "book-es/**"
      - "manual/**"
      - "manual-es/**"
      - ".github/workflows/book.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "book/**"
      - "book-es/**"
      - "manual/**"
      - "manual-es/**"
      - ".github/workflows/book.yml"
      - ".gitattributes"
  # Actions > Book > Run workflow publishes the book again by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the websites and the PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      # A released mdBook, pinned so every run builds the same book. The
      # action downloads the ready-built program and checks its checksum.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Build the websites
        run: |
          (cd book && mdbook build)
          (cd book-es && mdbook build)
          (cd manual && mdbook build)
          (cd manual-es && mdbook build)

      # The book uses music symbols (𝄾, ♩) and a few emoji. FreeSerif has
      # the symbols and Noto Color Emoji the emoji, so the PDF shows them
      # instead of empty boxes.
      - name: Install fonts for the PDFs
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-freefont-ttf fonts-noto-color-emoji

      # pypdf, a Python library for PDF files, adds the bookmarks to the
      # PDFs. The runner's Python won't install packages for everyone, so
      # it goes into a virtual environment of its own.
      - name: Install pypdf
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install --quiet pypdf==6.17.0

      # mdBook also writes print.html, every chapter on one page. A second
      # build in the light theme (the website stays dark) gives black text
      # on white paper; the MDBOOK_ variables override book.toml for this
      # build only. print-pdf.py adds a title page, the contents and an
      # index to that page, has Chrome (which the runner already has)
      # print it the way a browser's Print button does, without the date
      # and address at the top and bottom of each page, and adds the
      # bookmarks. print.css sets the paper size and the page numbers.
      # Each book has its own print-pdf.py, which reads the book.toml
      # next to it, so the Spanish PDF's title page and index are in
      # Spanish. A manual is printed by its language's script, with the
      # manual's folder named after the PDF.
      - name: Print the PDFs
        env:
          MDBOOK_OUTPUT__HTML__DEFAULT_THEME: light
          MDBOOK_OUTPUT__HTML__PREFERRED_DARK_THEME: light
        run: |
          (cd book && mdbook build --dest-dir pdf)
          "$RUNNER_TEMP/pdf-tools/bin/python" book/print-pdf.py book/pdf book/book/ferrous-lineup-book.pdf
          (cd book-es && mdbook build --dest-dir pdf)
          "$RUNNER_TEMP/pdf-tools/bin/python" book-es/print-pdf.py book-es/pdf book-es/book/ferrous-lineup-book-es.pdf
          (cd manual && mdbook build --dest-dir pdf)
          "$RUNNER_TEMP/pdf-tools/bin/python" book/print-pdf.py manual/pdf manual/book/ferrous-lineup-manual.pdf manual
          (cd manual-es && mdbook build --dest-dir pdf)
          "$RUNNER_TEMP/pdf-tools/bin/python" book-es/print-pdf.py manual-es/pdf manual-es/book/ferrous-lineup-manual-es.pdf manual-es
          test -s book/book/ferrous-lineup-book.pdf
          test -s book-es/book/ferrous-lineup-book-es.pdf
          test -s manual/book/ferrous-lineup-manual.pdf
          test -s manual-es/book/ferrous-lineup-manual-es.pdf

      # The PDFs are a download on every run, pull requests included. They
      # are also part of the website, next to their pages. One artifact
      # each: with `archive: false` only a single file can be uploaded.
      # Paths given to actions (`with: path:`) start at the top of the
      # repository: working-directory only applies to `run:` steps.
      - uses: actions/upload-artifact@v7
        with:
          path: book/book/ferrous-lineup-book.pdf
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: book-es/book/ferrous-lineup-book-es.pdf
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: manual/book/ferrous-lineup-manual.pdf
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: manual-es/book/ferrous-lineup-manual-es.pdf
          archive: false
          if-no-files-found: error

      # One site: the English book at the root (as today), the Spanish
      # book under /es/, and each manual under manual/ in its language.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r book/book/. site/
          cp -r book-es/book/. site/es/
          cp -r manual/book/. site/manual/
          cp -r manual-es/book/. site/es/manual/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Before the first run: Settings > Pages > Source: "GitHub Actions". The
  # `github-pages` environment that creates lets the default branch, main,
  # deploy.
  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time. A newer push waits for the one that is
    # publishing instead of cancelling it halfway. Builds of pull requests
    # don't wait for each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
