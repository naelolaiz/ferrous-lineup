name: Book

# Builds the book in book/ with mdBook, prints it to one PDF, and
# publishes both on GitHub Pages. Every pull request that changes the book
# builds it too, whichever branch it goes into (a book page stacked on the
# pull request of the change it describes included), so a change can be
# checked before it is merged; only a push to main, or a run by hand,
# publishes.
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
  # Actions > Book > Run workflow publishes the book again by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the website and the PDF
    runs-on: ubuntu-latest
    # The book's own files (book.toml, print.css, src/) are in book/, so
    # every command runs there, as if the book were the whole repository.
    defaults:
      run:
        working-directory: book
    steps:
      - uses: actions/checkout@v5

      # A released mdBook, pinned so every run builds the same book. The
      # action downloads the ready-built program and checks its checksum.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Build the website
        run: mdbook build

      # The book uses music symbols (𝄾, ♩) and a few emoji. FreeSerif has
      # the symbols and Noto Color Emoji the emoji, so the PDF shows them
      # instead of empty boxes.
      - name: Install fonts for the PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-freefont-ttf fonts-noto-color-emoji

      # pypdf, a Python library for PDF files, adds the bookmarks to the
      # PDF. The runner's Python won't install packages for everyone, so it
      # goes into a virtual environment of its own.
      - name: Install pypdf
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install --quiet pypdf==6.17.0

      # mdBook also writes print.html, every chapter on one page. A second
      # build in the light theme (the website stays dark) gives black text
      # on white paper; the MDBOOK_ variables override book.toml for this
      # build only. print-pdf.py adds a title page, the contents and an
      # index to that page, has Chrome (which the runner already has)
      # print it the way a browser's Print button does, without the date
      # and address at the top and bottom of each page, and adds the
      # bookmarks. print.css sets the paper size and the page numbers.
      - name: Print the PDF
        env:
          MDBOOK_OUTPUT__HTML__DEFAULT_THEME: light
          MDBOOK_OUTPUT__HTML__PREFERRED_DARK_THEME: light
        run: |
          mdbook build --dest-dir pdf
          "$RUNNER_TEMP/pdf-tools/bin/python" print-pdf.py pdf book/ferrous-lineup-book.pdf
          test -s book/ferrous-lineup-book.pdf

      # The PDF is a download on every run, pull requests included. It is
      # also part of the website, next to its pages.
      # Paths given to actions (`with: path:`) start at the top of the
      # repository: working-directory only applies to `run:` steps.
      - uses: actions/upload-artifact@v7
        with:
          path: book/book/ferrous-lineup-book.pdf
          archive: false
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  # Before the first run: Settings > Pages > Source: "GitHub Actions". The
  # `github-pages` environment that creates lets the default branch, main,
  # deploy.
  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time. A newer push waits for the one that is
    # publishing instead of cancelling it halfway. Builds of pull requests
    # don't wait for each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
