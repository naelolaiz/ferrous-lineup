app-id: io.github.naelolaiz.FerrousLineup
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ferrous-lineup

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Audio output, and the microphone for takes.
  - --socket=pulseaudio
  # The window is drawn with OpenGL.
  - --device=dri
  # MIDI keyboards and synths, and ALSA's sequencer.
  - --device=all
  # The band's SoundFont is downloaded on first use.
  - --share=network

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: ferrous-lineup
    buildsystem: simple
    build-options:
      env:
        # cargo-sources.json unpacks the crates and a Cargo config here.
        CARGO_HOME: /run/build/ferrous-lineup/cargo
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm755 target/release/ferrous-lineup -t /app/bin/
      - install -Dm644 packaging/linux/io.github.naelolaiz.FerrousLineup.desktop -t /app/share/applications/
      - install -Dm644 packaging/icon/ferrous-lineup.svg /app/share/icons/hicolor/scalable/apps/io.github.naelolaiz.FerrousLineup.svg
      - install -Dm644 packaging/linux/application-x-ferrous-lineup.xml -t /app/share/mime/packages/
      - install -Dm644 packaging/linux/io.github.naelolaiz.FerrousLineup.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 README.md LICENSE -t /app/share/doc/ferrous-lineup/
    sources:
      - type: git
        url: https://github.com/naelolaiz/ferrous-lineup.git
        tag: v0.5.0
        commit: b4e72107938833bc60af54a56d3397b83cbedb07
      # Git sources leave LFS pointers behind. Download the build assets
      # before entering the offline build sandbox, replacing those pointers.
      - type: file
        url: https://media.githubusercontent.com/media/naelolaiz/ferrous-lineup/b4e72107938833bc60af54a56d3397b83cbedb07/crates/lineup-app/assets/fonts/Bravura.otf
        sha256: cdf0f893ee1fdb64b7f6713d71ee0dcfc349c0ac01429a8e451b01a9e79f5f3b
        dest: crates/lineup-app/assets/fonts
        dest-filename: Bravura.otf
      - type: file
        url: https://media.githubusercontent.com/media/naelolaiz/ferrous-lineup/b4e72107938833bc60af54a56d3397b83cbedb07/crates/lineup-app/assets/fonts/Inter-Regular.otf
        sha256: be6d709dcb730ddaf050cbdae6fe89bd56d5d14dc66885639bbf6f06bd03521b
        dest: crates/lineup-app/assets/fonts
        dest-filename: Inter-Regular.otf
      - type: file
        url: https://media.githubusercontent.com/media/naelolaiz/ferrous-lineup/b4e72107938833bc60af54a56d3397b83cbedb07/crates/lineup-app/assets/fonts/Inter-SemiBold.otf
        sha256: bd68706b7bf8b3c580ae57685a2116bb1704b3a9998309ccfec7cd486f8a593e
        dest: crates/lineup-app/assets/fonts
        dest-filename: Inter-SemiBold.otf
      - type: file
        url: https://media.githubusercontent.com/media/naelolaiz/ferrous-lineup/b4e72107938833bc60af54a56d3397b83cbedb07/crates/lineup-app/assets/icon/icon-256.rgba
        sha256: 87691b9d2e504729cae305039517570369fbf9bb39e90990bcc717904c7a60d2
        dest: crates/lineup-app/assets/icon
        dest-filename: icon-256.rgba
      - cargo-sources.json
